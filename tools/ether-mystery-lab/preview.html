<title>Ether Mystery Lab — Preview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90' fill='%23E8B871'%3E%E2%9C%BF%3C/text%3E%3C/svg%3E">

<link rel="stylesheet" href="../../vihuplanet/runtime/css/runtime.css">
<style>
  /* Chrome for a REVIEWER, not for a child. Two navigation controls
     and, when something cannot be shown, one sentence saying so. There
     is no instruction anywhere over the sky: whether the Mystery
     communicates itself is the whole thing being judged, and a caption
     explaining it would answer the question for the reviewer. */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #12182B;
               color: #F1EAD0; font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
               overflow: hidden; }
  .stage { position: absolute; inset: 0; }
  .stage-universe { position: absolute; inset: 0; }

  .chrome { position: absolute; top: 12px; right: 14px; z-index: 50;
            display: flex; gap: 8px; opacity: .55; transition: opacity .25s; }
  .chrome:hover { opacity: 1; }
  .chrome button { background: rgba(18,24,43,.72); color: #F1EAD0;
                   border: 1px solid rgba(241,234,208,.28); border-radius: 999px;
                   padding: 5px 13px; font: inherit; cursor: pointer; }
  .chrome button:hover { border-color: #E8B871; color: #E8B871; }

  .chrome .try-badge { background: rgba(58,52,24,.86); color: #E8B871;
                       border: 1px solid rgba(232,184,113,.5); border-radius: 999px;
                       padding: 5px 13px; align-self: center; }

  /* THE LEADING HINT — the ONE thing the child-facing half of this
     preview says, and it is drawn by the LAB rather than by the
     interpreter: a production Mystery still carries no text at all.
     It names what KIND of thing is waiting and never the interaction
     (§4 — "connect the dots to make a falcon" is exactly what it may
     not say). Ether's own paper-cream, wide letters, no box, no
     border, nothing to press. */
  .hint { position: absolute; left: 0; right: 0; top: 8.5%; z-index: 40;
          text-align: center; pointer-events: none;
          color: rgba(241,234,208,.82); font-size: 17px; font-weight: 400;
          letter-spacing: .055em; text-shadow: 0 1px 18px rgba(10,14,28,.85);
          padding: 0 8%; opacity: 0; transition: opacity 1.6s ease; }
  .hint.on { opacity: 1; }
  @media (max-width: 640px) { .hint { font-size: 15px; top: 7%; } }

  /* THE TEASE. Drawn by the LAB over the real interpreter, exactly as
     the leading hint above it is — so the candidate the Ether performs
     is byte-identical with it and without it, and whether the world
     may lean toward a gap stays a question rather than a shipped
     answer. Beneath the hint, above the universe, inert to touch. */
  /* A canvas is a REPLACED element, so `inset:0` alone leaves it at
     its intrinsic 300x150 — measured. The size has to be said. */
  .tease { position: absolute; inset: 0; width: 100%; height: 100%;
           z-index: 30; pointer-events: none; }

  .unavailable { position: absolute; inset: 0; z-index: 60; display: none;
                 align-items: center; justify-content: center; padding: 40px;
                 background: rgba(18,24,43,.86); }
  .unavailable.on { display: flex; }
  .unavailable div { max-width: 520px; text-align: center; }
  .unavailable h2 { font-size: 16px; color: #E8B871; margin: 0 0 10px; font-weight: 600; }
  .unavailable p { color: rgba(241,234,208,.72); margin: 6px 0; }
</style>
</head>
<body>

<!-- THIS PAGE IS NOT THE PRODUCT, and it is not a second Ether. It
     mounts the real universe, the real creature layer, the real touch
     layer and the real Mystery interpreter, hands ONE candidate to the
     interpreter through the same seam the Experience Composer uses,
     and gets out of the way. The production pool is deliberately NOT
     loaded here: a preview has no business being able to see it, let
     alone reach it. -->
<main class="stage">
  <div class="stage-universe" data-universe></div>

  <!-- The leading hint. Lab-rendered, over the real sky, and the only
       words in the child-facing half of the preview. -->
  <canvas class="tease" data-tease hidden></canvas>
  <div class="hint" data-hint></div>

  <div class="chrome" data-chrome hidden>
    <!-- Reviewer chrome, in the same corner as the two controls. It is
         the ONE thing that may say which kind of preview this is: §2
         requires the distinction to be obvious, and a reviewer must
         never mistake a research run for what the sky would really do.
         There is still not one word of instruction over the sky. -->
    <span class="try-badge" data-try-badge hidden>🧪 TRY IDEA — RESEARCH ONLY</span>
    <button type="button" data-act="replay">⟲ Replay</button>
    <button type="button" data-act="exit">✕ Exit Preview</button>
  </div>

  <div class="unavailable" data-unavailable>
    <div>
      <h2>Preview unavailable — unsupported runtime capability</h2>
      <p data-unavailable-why></p>
      <p><button type="button" data-act="exit">✕ Back to the Lab</button></p>
    </div>
  </div>
</main>
