<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VihuPlanet</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90' fill='%23E8B871'%3E%E2%9C%BF%3C/text%3E%3C/svg%3E">

<body>

<!-- ===============================================================
     VihuPlanet is Home. VihuStudio is the Hall of Creation.
     Children visit the Studio. They live here.

     This is the one entrance, and it is the same entrance for
     everybody — a first-time Traveller, a Returning Traveller, a
     first-time Creator and a Returning Creator all land on exactly
     this screen. Nobody bypasses it and nobody gets a different one.

     The Studio moved to studio.html for this. It was index.html —
     the application home — and it is not the application home any
     more. Renaming rather than relocating keeps every one of its
     relative paths intact; nothing inside the Studio changed.
     =============================================================== -->

<main class="vp-home">
  <div class="vp-home-universe" data-universe></div>

  <!-- The threshold. One tap, once per visit, before the universe is
       handed over. It is not a loading screen — the Ether is already
       alive behind it — it is the moment of arriving somewhere. -->
  <div class="vp-threshold" data-threshold>
    <h1 class="vp-threshold-title">VihuPlanet</h1>
    <button type="button" class="vp-threshold-tap" data-begin>Tap to Begin</button>
  </div>

  <!-- The two permanent actions. They never change: not for different
       children, not as a child grows, not once they have published a
       hundred stories. What changes is what happens behind them, and
       js/journeyResolver.js is the only thing that decides that. -->
  <nav class="vp-actions" data-actions hidden aria-label="VihuPlanet">
    <button type="button" class="vp-action" data-act="stars">
      <span class="vp-action-glyph" aria-hidden="true">⭐</span>
      <span class="vp-action-label">Show Me Your Stars</span>
    </button>
    <button type="button" class="vp-action is-primary" data-act="create">
      <span class="vp-action-glyph" aria-hidden="true">✨</span>
      <span class="vp-action-label">Create Story</span>
    </button>
  </nav>

  <!-- ===============================================================
       Mark Your Stars.
       This is how VihuPlanet recognises its Creators. It is not a
       login: there is no account behind it, nothing to remember and
       nothing that can expire. A child draws the constellation from
       their own Magic Card and the universe either knows that sky or
       does not.

       It opens for EVERYBODY who asks — no Creator check first, no
       Lumo, no dialogue. A returning Creator on a new device looks
       exactly like a first-time Traveller to this browser; the only
       thing that can tell them apart is the sky itself, so the sky is
       what gets asked for.

       Two buttons, and only two. It is an overlay over the living
       Ether, never a page: the universe carries on behind it, which is
       the whole idea — you are being recognised by somewhere, not
       authenticated by something.
       =============================================================== -->
  <div class="vp-stars" data-stars hidden role="dialog" aria-modal="true"
       aria-labelledby="vp-stars-title">
    <div class="vp-stars-veil" data-stars-veil></div>
    <div class="vp-stars-panel">
      <h2 class="vp-stars-title" id="vp-stars-title">Mark Your Stars</h2>
      <p class="vp-stars-subtitle">Draw the constellation from your Magic Card.</p>

      <div class="vp-stars-sky" data-stars-sky></div>

      <!-- The one line that ever speaks here. It never blames: no
           "incorrect", no "invalid", no "wrong", no "failed". A
           Creator's stars are never wrong — they are only, sometimes,
           not recognised. -->
      <p class="vp-stars-status" data-stars-status role="status" aria-live="polite"></p>

      <!-- Two buttons, and only two. After several tries the pair is
           swapped for Try Again / Create Story rather than a third and
           fourth button appearing beside them — the screen changes
           what it offers, it never grows. -->
      <!-- Moving the whole sky at once. Shown only when the camera has
           marked the board, because that is the only time a child has
           a complete constellation sitting in the wrong place. -->
      <div class="vp-stars-nudge" data-stars-nudge hidden>
        <span class="vp-stars-nudge-label">Move them together</span>
        <div class="vp-stars-nudge-pad">
          <button type="button" data-nudge="up" aria-label="Move up">↑</button>
          <button type="button" data-nudge="left" aria-label="Move left">←</button>
          <button type="button" data-nudge="right" aria-label="Move right">→</button>
          <button type="button" data-nudge="down" aria-label="Move down">↓</button>
        </div>
      </div>
      <div class="vp-stars-actions" data-stars-actions>
        <button type="button" class="is-primary" data-stars-act="continue">Continue</button>
        <button type="button" data-stars-act="no-card">I Don’t Have One Yet</button>
      </div>
      <div class="vp-stars-actions" data-stars-actions-retry hidden>
        <button type="button" class="is-primary" data-stars-act="retry">Try Again</button>
        <button type="button" data-stars-act="create">Create Story</button>
      </div>

      <!-- Back to the camera. Same treatment as the recovery door
           below and for the same reason: Decision 11 fixes this screen
           at two buttons, and this is not a third choice — it is the
           way back for a child who came in HOLDING their card and
           whose reading did not land. Without it the only routes out
           of an unrecognised reading were drawing the whole sky by
           hand or leaving, and a child with the card still in their
           other hand should simply be able to show it again.

           Hidden unless the camera is what filled this board, so a
           child who chose to draw is never offered a way back to
           something they did not use. -->
      <button type="button" class="vp-stars-lost" data-stars-act="camera" hidden>
        📷 Show My Card Again
      </button>

      <!-- Sky Protection's recovery door. Quiet, and under the two
           buttons rather than beside them — it is not a third choice,
           it is the way out for a child who cannot answer the question
           at all. A parent who was given the Magic Card has it; this
           says so, and sends it again. -->
      <button type="button" class="vp-stars-lost" data-stars-act="lost">
        I Don’t Have My Magic Card
      </button>
      <!-- The way out. A child who opens this and changes their mind
           was stuck here: every control on the screen answers the
           question, and none of them declines it. The universe is
           still running underneath, so leaving costs nothing and
           returns them exactly where they were. Same words as the
           portal's own, because it is the same journey back. -->
      <button type="button" class="vp-stars-away" data-stars-act="away">
        Back to the Ether
      </button>
    </div>
  </div>

  <!-- Stage 4 · Preview. Appears when a Spirit has been met, and says
       only what the Story actually knows about itself. -->
  <aside class="ether-preview" data-preview hidden aria-live="polite">
    <h2 class="ether-preview-title" data-preview-title></h2>
    <p class="ether-preview-creator" data-preview-creator></p>
    <p class="ether-preview-meta" data-preview-meta></p>
    <div class="ether-preview-actions">
      <button type="button" class="is-primary" data-act="read">Read story</button>
      <button type="button" data-act="continue">Continue</button>
      <button type="button" data-act="cheer">Cheer</button>
      <button type="button" data-act="back">Back</button>
    </div>
  </aside>

  <!-- ⭐ Show Me Your Stars, taken literally.
       A child raised their Magic Card to the camera without being asked
       to. This is the product agreeing with them: the Ether stays
       behind it, softened, and VihuPlanet looks at the card the child
       is holding. Not a scanner, not a login — no frame corners, no
       progress percentages, no technical words anywhere on it. -->
  <div class="vp-scan" data-scan hidden>
    <div class="vp-scan-veil"></div>
    <div class="vp-scan-inner">
      <p class="vp-scan-line" data-scan-line>✨ Show me your Magic Card ✨</p>
      <div class="vp-scan-window">
        <video class="vp-scan-video" data-scan-video playsinline muted></video>
        <!-- Where to hold it. A soft shape, not a targeting reticle. -->
        <div class="vp-scan-hold" data-scan-hold></div>
        <!-- The sky that was just recognised, drawn where the camera
             was. The card is put down and the stars come out — the
             child sees their own constellation before anything moves
             on. -->
        <canvas class="vp-scan-sky" data-scan-sky hidden></canvas>
      </div>
      <div class="vp-scan-actions" data-scan-actions hidden>
        <button type="button" class="vp-scan-btn" data-scan-act="again">Try Again</button>
        <button type="button" class="vp-scan-btn" data-scan-act="draw">✏️ Draw Your Stars</button>
      </div>
      <button type="button" class="vp-scan-away" data-scan-act="close">Back to the Ether</button>
    </div>
  </div>

  <!-- Stage 5 · the Portal. An overlay, never a page — the universe
       stays alive underneath, which is what makes coming back exact. -->
  <div class="ether-portal" data-portal hidden role="dialog" aria-modal="true"
       aria-label="Reading a story">
    <div class="ether-portal-veil"></div>
    <div class="ether-portal-inner">
      <header class="ether-portal-bar">
        <!-- The story's name, and under it whose story it is. A child
             reading somebody else's story should know whose it is
             while they are reading it, not only in the moment before
             they open it. Empty for a Canon Story, which belongs to
             nobody (Decision 13) — and empty, rather than a guess, for
             a story shared before its maker travelled with it. -->
        <span class="ether-portal-heading">
          <span class="ether-portal-title" data-portal-title></span>
          <span class="ether-portal-creator" data-portal-creator hidden></span>
        </span>
        <button type="button" class="ether-portal-close" data-portal-close
                aria-label="Back to the Ether">Back to the Ether</button>
      </header>
      <div class="ether-portal-stage">
        <button type="button" class="ether-portal-arrow is-prev" data-portal-prev
                aria-label="Previous page">‹</button>
        <img class="ether-portal-page" data-portal-page alt="">
        <button type="button" class="ether-portal-arrow is-next" data-portal-next
                aria-label="Next page">›</button>
      </div>
      <p class="ether-portal-count" data-portal-count></p>
    </div>
  </div>
</main>

<!-- ---------- VihuStudio: identity and Stories ----------
     Only what reading published Stories and recognising a Creator
     actually needs. This page does not load the Studio. -->
<!-- The platform client. Both js/creatorProjectSync.js and
     MagicCard.recall() reach for it by name and degrade quietly when it
     is absent, which is how this page shipped — and which quietly meant
     a Creator arriving on a NEW device could never be recognised, since
     the only thing that knows every card ever claimed lives behind it.
     It is standalone, loads the Supabase client lazily from a CDN only
     if it is ever used, and treats a missing supabase-config.json as a
     normal unconfigured state rather than an error. -->
<script src="js/themeRepositoryClient.js?v=0529"></script>
<script src="js/creatorProjectCache.js?v=0529"></script>
<script src="js/creatorProjectStore.js?v=0529"></script>
<script src="js/creatorProjectSync.js?v=0529"></script>
<script src="js/magicCard.js?v=0529"></script>
<!-- How VihuPlanet recognises a Creator: the sky they draw, and the
     one place that asks whether it is theirs. -->
<script src="js/constellationBoard.js?v=0529"></script>
<script src="js/creatorRecognition.js?v=0529"></script>
<!-- "Show me your Magic Card." A child raised their card to the camera
     without being asked to, so the camera now looks for it. The card
     art is what it reads (it shares that module's grid geometry), and
     the sky it finds goes to creatorRecognition above — no second
     identity system. -->
<script src="js/magicCardArt.js?v=0529"></script>
<!-- OpenCV.js, fetched only when the camera is opened. See
     js/openCv.js for why it comes from a CDN and how it fails. -->
<script src="js/openCv.js?v=0529"></script>
<script src="js/magicCardVision.js?v=0529"></script>
<script src="js/skyProtection.js?v=0529"></script>
<!-- The Ether's ambience. Self-contained — no other module needed —
     and it resolves its own asset paths from this script's location,
     so it works from the root exactly as it does from the Studio. -->
<script src="js/audioManager.js?v=0529"></script>
<!-- The Canon Repository: the official stories of VihuPlanet, shipped
     with the application. They join the Ether on the same terms as
     everything else and carry no creator, because they are owned by
     nobody. -->
<script src="js/canonRepository.js?v=0529"></script>
<script src="js/etherFeed.js?v=0529"></script>
<script src="js/journeyResolver.js?v=0529"></script>
